<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Bot Balance</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#14171c; --muted:#6b7280; --up:#0f8a4b; --down:#c43c3c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --muted:#9aa1ad; --up:#3ccf86; --down:#ff7070; } }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding:16px; box-sizing:border-box; }
  #cards { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; width:100%; }
  .card { background:var(--card); border-radius:20px; padding:28px 24px; text-align:center; width:100%; max-width:340px;
          box-sizing:border-box; box-shadow:0 2px 20px rgba(0,0,0,.08); }
  .label { color:var(--muted); font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  .bal { font-size:48px; font-weight:700; margin:8px 0 4px; font-variant-numeric:tabular-nums; }
  .chg { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  .pos { margin-top:14px; font-size:14px; font-variant-numeric:tabular-nums; text-align:left; }
  .pos div { display:flex; justify-content:space-between; padding:4px 0; }
  .cash { color:var(--muted); font-size:13px; margin-top:12px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; line-height:1.4; }
  .foot { color:var(--muted); font-size:13px; margin-top:18px; line-height:1.5; text-align:center; }
</style>
</head>
<body>
<div id="cards"><div class="card"><div class="label">Live account value</div><div class="bal">&mdash;</div></div></div>
<div class="foot" id="foot">Loading&hellip;</div>
<script>
const sign = x => (x >= 0 ? '+' : '−');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function card(a, label) {
  const value = a.value ?? a.cash, diff = value - a.start;
  const pos = (a.positions || []).map(p =>
    '<div><span>' + esc(p.symbol) + ' @ $' + p.price.toFixed(2) + '</span><span class="' + (p.pnl >= 0 ? 'up' : 'down') + '">' +
    sign(p.pnl) + '$' + Math.abs(p.pnl).toFixed(2) + '</span></div>').join('');
  return '<div class="card"><div class="label">' + esc(label) + '</div>' +
    '<div class="bal">$' + value.toFixed(2) + '</div>' +
    '<div class="chg ' + (diff >= 0 ? 'up' : 'down') + '">' + sign(diff) + '$' + Math.abs(diff).toFixed(2) +
    ' (' + sign(diff) + Math.abs(diff / a.start * 100).toFixed(2) + '%)</div>' +
    '<div class="pos">' + pos + '</div>' +
    '<div class="cash">Cash $' + a.cash.toFixed(2) + '</div>' +
    (a.note ? '<div class="note">' + esc(a.note) + '</div>' : '') + '</div>';
}
async function load() {
  try {
    const r = await fetch('balance.json?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    const accts = d.accounts || [Object.assign({}, d, { name: 'Live account value' })];
    document.getElementById('cards').innerHTML = accts.map(a => card(a, a.name)).join('');
    document.getElementById('foot').innerHTML = 'Prices as of ' + esc(d.updated) + '<br>Simulated trades, fake money';
  } catch (e) { document.getElementById('foot').textContent = 'Could not load balance.'; }
}
load(); setInterval(load, 500);
</script>
</body>
</html>
