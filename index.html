<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Bot Balance</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#14171c; --muted:#6b7280; --up:#0f8a4b; --down:#c43c3c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --muted:#9aa1ad; --up:#3ccf86; --down:#ff7070; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:20px; padding:32px 28px; text-align:center; width:100%; max-width:360px;
          box-shadow:0 2px 20px rgba(0,0,0,.08); }
  .label { color:var(--muted); font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  .bal { font-size:56px; font-weight:700; margin:8px 0 4px; font-variant-numeric:tabular-nums; }
  .chg { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); }
  .foot { color:var(--muted); font-size:13px; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Paper account balance</div>
  <div class="bal" id="bal">&mdash;</div>
  <div class="chg" id="chg"></div>
  <div class="foot" id="foot">Loading&hellip;</div>
</div>
<script>
async function load() {
  try {
    const r = await fetch('balance.json?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    const diff = d.cash - d.start;
    document.getElementById('bal').textContent = '$' + d.cash.toFixed(2);
    const c = document.getElementById('chg');
    c.textContent = (diff >= 0 ? '+' : '−') + '$' + Math.abs(diff).toFixed(2) + ' (' + (diff >= 0 ? '+' : '−') + Math.abs(diff / d.start * 100).toFixed(2) + '%)';
    c.className = 'chg ' + (diff >= 0 ? 'up' : 'down');
    document.getElementById('foot').innerHTML = (d.open ? d.open + ' open trade' + (d.open > 1 ? 's' : '') + '<br>' : '') +
      'Updated ' + d.updated + '<br>Simulated trades, fake money';
  } catch (e) { document.getElementById('foot').textContent = 'Could not load balance.'; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
